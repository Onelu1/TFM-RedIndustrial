# Definimos el nombre de nuestro proyecto
name: tfm-industrial-sim

# 1. DEFINICIÓN DE REDES (Subredes)
# Aquí creamos la segmentación de nuestra fábrica
networks:
  red_ot: # Red de Campo (Sensores y PLCs)
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24 # Rango de IPs de la red industrial
  
  red_control: # Red IT/Supervisión (SCADA y Atacantes)
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24 # Rango de IPs de la red de supervisión

# 2. DEFINICIÓN DE SERVICIOS (Máquinas/Nodos)
services:
# Nodo 1: El PLC (OpenPLC)
  openplc:
    # Descarga y compila la imagen directamente desde el repositorio oficial
    build: https://github.com/thiagoralves/OpenPLC_v3.git
    container_name: openplc_nodo
    # Permiso para modificar sus propias rutas
    cap_add:
      - NET_ADMIN
    networks:
      red_ot:
        ipv4_address: 192.168.10.10 # IP fija en la red OT
    ports:
      - "8080:8080" # Puerto del panel web de OpenPLC
      - "502:502"   # Puerto estándar de Modbus TCP
    restart: always

# Nodo 2: El SCADA (Node-RED)
  nodered:
    image: nodered/node-red:latest
    container_name: nodered_scada
    cap_add:
      - NET_ADMIN
    networks:
      red_control:
        ipv4_address: 192.168.20.10
    ports:
      - "1880:1880"
    volumes:
      # Mapeamos la carpeta local con nuestros flujos y librerias
      - ./nodered_data:/data
    restart: always
# Nodo 3: El Atacante (Kali Linux)
  kali_atacante:
    image: kalilinux/kali-rolling
    container_name: kali_nodo
    # Permiso para modificar sus propias rutas
    cap_add:
      - NET_ADMIN
    # Añadimos 'iproute2' a la lista de instalación
    command: /bin/sh -c "apt-get update && apt-get install -y nmap iputils-ping iproute2 && tail -f /dev/null"
    networks:
      red_control:
        ipv4_address: 192.168.20.66

# Nodo 4: El Enrutador (Simulación de Gateway)
  router:
    image: alpine:latest
    container_name: router_gw
    # Usamos la directiva nativa de Docker para modificar el kernel
    sysctls:
      - net.ipv4.ip_forward=1
    command: tail -f /dev/null
    cap_add:
      - NET_ADMIN
    networks:
      red_ot:
        ipv4_address: 192.168.10.254
      red_control:
        ipv4_address: 192.168.20.254